name: publish

# Un tag = une app = une release. `zachart-v1.2.3` construit Zachar’t Mentale,
# `base-v0.1.0` construit Base ; chaque app a sa propre version (voir
# docs/RELEASE.md). Les tags historiques `v*` restent en place et ne relancent
# rien.
on:
  push:
    tags:
      - 'zachart-v*'
      - 'base-v*'
      - 'zachart-maths-v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Le tag dit quelle app construire. Une seule ligne par app à ajouter ici
      # quand la suite en gagne une (avec `bun run new-app`).
      #   app        dossier sous apps/
      #   prefix     préfixe du tag, et nom de la release roulante `updater-<prefix>`
      #   title      nom affiché de la release
      #   updater    true si l'app signe ses mises à jour (produit un latest.json)
      #   prerelease true pour toute app sauf Zachar’t : `releases/latest` sert
      #              encore de point d'entrée aux installations de Zachar’t
      #              existantes, une release d'une autre app ne doit pas le voler.
      #   asset      nom FIXE (ASCII) de l'installeur sur la release roulante
      #   key/pass   noms des secrets de signature de l'app
      - name: pick the app from the tag
        id: app
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            zachart-v*)
              app=zachart-mentale prefix=zachart title='Zachar’t Mentale' updater=true prerelease=false
              asset=Zachart-Mentale-setup.exe
              key=TAURI_SIGNING_PRIVATE_KEY pass=TAURI_SIGNING_PRIVATE_KEY_PASSWORD ;;
            base-v*)
              app=base prefix=base title='Base' updater=false prerelease=true
              asset=Base-setup.exe
              key=TAURI_SIGNING_PRIVATE_KEY_BASE pass=TAURI_SIGNING_PRIVATE_KEY_BASE_PASSWORD ;;
            zachart-maths-v*)
              app=zachart-maths prefix=zachart-maths title="Zach'Math" updater=true prerelease=true
              asset=Zachart-Maths-setup.exe
              key=TAURI_SIGNING_PRIVATE_KEY pass=TAURI_SIGNING_PRIVATE_KEY_PASSWORD ;;
            *)
              echo "::error::Le tag $GITHUB_REF_NAME ne correspond à aucune app." ; exit 1 ;;
          esac
          {
            echo "app=$app"; echo "prefix=$prefix"; echo "title=$title"
            echo "updater=$updater"; echo "prerelease=$prerelease"
            echo "asset=$asset"; echo "key=$key"; echo "pass=$pass"
          } >> "$GITHUB_OUTPUT"

      # Un tag posé sur une version qui n'est pas celle du code publierait un
      # installeur sous un faux numéro — et l'updater comparerait ce numéro.
      - name: check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./apps/${{ steps.app.outputs.app }}/src-tauri/tauri.conf.json').version")
          expected="${{ steps.app.outputs.prefix }}-v$version"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de l'app (attendu : $expected)."
            exit 1
          fi

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      # Seulement l'app publiée et le code partagé : les autres apps ont déjà été
      # testées par build.yml sur la PR, et ne changent pas avec ce tag.
      - name: run tests
        run: bun run --filter '@suite/shared' --filter '${{ steps.app.outputs.app }}' test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Les secrets sont choisis par NOM : la clé d'une app ne signe jamais
          # celle d'une autre, et la fuite de l'une ne compromet pas les autres.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets[steps.app.outputs.key] }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets[steps.app.outputs.pass] }}
        with:
          projectPath: apps/${{ steps.app.outputs.app }}
          tagName: ${{ steps.app.outputs.prefix }}-v__VERSION__
          releaseName: '${{ steps.app.outputs.title }} v__VERSION__'
          releaseBody: 'Voir les fichiers attachés pour installer cette version.'
          releaseDraft: false
          prerelease: ${{ steps.app.outputs.prerelease == 'true' }}

      # Le latest.json d'une app doit être trouvable à une adresse qui ne dépend
      # pas de « la dernière release du dépôt » (toutes apps confondues). Il est
      # donc recopié sur une release roulante `updater-<app>`, réécrite à chaque
      # publication. Voir docs/RELEASE.md pour la migration des installations
      # existantes de Zachar’t Mentale.
      #
      # Elle porte aussi l'installeur sous un nom FIXE (`asset`) : le lien
      # `releases/download/updater-<prefix>/<asset>` donne toujours la dernière
      # version, pour toutes les apps au même endroit (voir le README).
      - name: publish the installer and latest.json on the rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rolling="updater-${{ steps.app.outputs.prefix }}"
          if ! gh release view "$rolling" > /dev/null 2>&1; then
            gh release create "$rolling" \
              --prerelease --latest=false \
              --title "Téléchargement et mises à jour de ${{ steps.app.outputs.title }}" \
              --notes "Release technique : elle porte la dernière version de l'installeur et le latest.json que l'application interroge. Ne pas la supprimer."
          fi
          installer=$(ls target/release/bundle/nsis/*-setup.exe | head -n 1)
          cp "$installer" "${{ steps.app.outputs.asset }}"
          gh release upload "$rolling" "${{ steps.app.outputs.asset }}" --clobber
          if [ "${{ steps.app.outputs.updater }}" = "true" ]; then
            gh release download "$GITHUB_REF_NAME" --pattern latest.json --clobber
            gh release upload "$rolling" latest.json --clobber
          fi

      # La page /releases liste toutes les releases, toutes apps confondues. Pour
      # n'y voir que la dernière version de chaque logiciel, les anciennes
      # releases de l'app sont supprimées (les TAGS restent). Désactivé par
      # défaut : à activer avec la variable de dépôt PRUNE_OLD_RELEASES=true
      # (Settings > Secrets and variables > Actions > Variables).
      - name: keep only the latest release of this app
        if: vars.PRUNE_OLD_RELEASES == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pattern="^${{ steps.app.outputs.prefix }}-v[0-9]+\.[0-9]+\.[0-9]+$"
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E "$pattern" | grep -vx "$GITHUB_REF_NAME" \
            | while read -r old; do gh release delete "$old" --yes; done

name: build

# Le bundle NSIS ne casse qu'au moment du `tauri build`, sur Windows : la v0.1.0
# a compilé, échoué à l'étape installeur, et le tag n'a porté que les archives
# source générées par GitHub. Ce workflow refait le même build hors release, pour
# vérifier avant de poser un tag — et pour récupérer un .exe testable à tout
# moment via « Run workflow ».
on:
  pull_request:
  # Un push sur main chauffe le cache Rust : un cache n'est lisible que depuis sa
  # ref ou la branche par défaut, donc sans ce déclencheur chaque tag de release
  # recompilerait tout Tauri à froid.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Le site (vitrine + bibliothèque d'administration) est un projet web à part :
  # il n'est ni compilé ni testé par le job Windows, qui ne connaît que
  # l'application de bureau. Sans ce job, une erreur de types dans `apps/site`
  # ne se découvrirait qu'au `docker build` du déploiement.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: run site tests
        run: bun run --filter site test

      # Exactement ce que fait `infra/Dockerfile` : `astro check && astro build`.
      - name: build the site
        run: bun run --filter site build

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: install frontend dependencies
        run: bun install

      - name: run tests
        run: bun run test

      - name: run Rust tests
        run: cargo test --workspace

      # Les scripts du dépôt (new-app, bump-version) ont leurs propres tests, hors
      # de vitest.
      - name: run the repository scripts tests
        run: bun test scripts

      # Pas de `createUpdaterArtifacts` ici : signer demanderait
      # TAURI_SIGNING_PRIVATE_KEY, indisponible sur une PR venue d'un fork. Ce
      # qu'on veut valider — que makensis produit bien l'installeur — n'en
      # dépend pas.
      - name: build the NSIS installer of Zachar’t Mentale
        shell: bash
        working-directory: apps/zachart-mentale
        run: bun tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # Base est le gabarit de toutes les futures apps : s'il ne se construit plus,
      # `bun run new-app` fabriquerait des apps cassées.
      - name: build the NSIS installer of Base
        shell: bash
        working-directory: apps/base
        run: bun tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # Zach'Math n'est pas encore publiée (pas de tag ni de clé de mise à jour,
      # voir docs/RELEASE.md), mais son installeur doit se construire dès
      # maintenant : c'est ce « Run workflow » qui en livre un .exe testable.
      - name: build the NSIS installer of Zach'Math
        shell: bash
        working-directory: apps/zachart-maths
        run: bun tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

[package]
name = "zachart-mentale"
version = "1.6.0"
description = "A Tauri App"
authors = ["aifedespaix"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zachart_mentale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suite-tauri = { path = "../../../crates/suite-tauri" }

# Declared here although `suite-tauri` is what registers them: `tauri-build`
# discovers a plugin's permissions (`opener:default`, `fs:allow-*`…) only
# from the app crate's DIRECT dependencies, and `capabilities/default.json`
# fails to build without them.
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

